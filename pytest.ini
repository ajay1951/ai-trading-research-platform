[pytest]
pythonpath = .
testpaths = tests/data tests/leakage tests/backtest tests/risk tests/execution tests/api tests/cross_sectional tests/paper_trading
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
asyncio_mode = auto
norecursedirs = venv .venv .git node_modules
