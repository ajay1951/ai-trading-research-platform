# PyTorch LSTM Sequential Deep Learning Model Configuration
model:
  type: "lstm"
  architecture:
    input_dim: null  # Dynamically inferred from feature pipeline
    hidden_dim: 48
    num_layers: 2
    dropout: 0.20
    output_dim: 2

training:
  sequence_length: 24   # 24-hour lookback window
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 10
  early_stopping_patience: 3
  seed: 42
  device: "cuda_if_available"

execution:
  prediction_threshold: 0.52
  fee_rate: 0.0004
  slippage: 0.0002
